<!DOCTYPE html>
<html>
<head>
  <title>Weekly Meal Planner</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .day-card { background: white; padding: 15px; border-radius: 8px; border-top: 5px solid #4CAF50; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .day-name { font-weight: bold; color: #555; margin-bottom: 5px; }
    .meal-name { font-size: 1.1em; color: #333; }
    .protein-tag { font-size: 0.8em; color: #888; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Weekly Dinner Planner</h1>
  <p>Enter your ingredients separated by commas:</p>
  <input id="ingredients" size="60" placeholder="chicken breast, rice, egg, garlic, spinach">
  <button onclick="generate()">Generate Plan</button>

  <div id="output" class="calendar"></div>

<script>
async function generate() {
  const input = document.getElementById("ingredients").value;
  const ingredients = input.split(",").map(i => i.trim());

  // Call your new api/plan.py function
  const res = await fetch("/api/plan", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ ingredients })
  });

  const plan = await res.json();
  const container = document.getElementById("output");
  container.innerHTML = "";

  plan.forEach(day => {
    const card = document.createElement("div");
    card.className = "day-card";
    card.innerHTML = `
      <div class="day-name">${day.day}</div>
      <div class="meal-name">${day.meal}</div>
      <div class="protein-tag">${day.protein}</div>
    `;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
